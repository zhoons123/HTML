<!DOCTYPE html>
<!-- =========================================================
     2교시 클론 코딩 : 나의 프로필 카드
     * 이 HTML 파일은 완성된 상태입니다. 수정하지 않습니다.
     * 오늘은 style.css 파일에 CSS를 작성합니다.
     ========================================================= -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 프로필 카드</title>
  <!-- 외부 CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="site-title">나의 프로필 카드</h1>
  </header>

  <main>
    <section class="card">
      <img class="photo" src="profile.svg" alt="웃고 있는 프로필 그림">
      <h2>김코딩</h2>
      <p class="intro">웹 개발을 배우고 있는 신입 개발자입니다. 매일 조금씩 성장하고 있어요.</p>
      <ul class="info">
        <li>사는 곳 : 서울</li>
        <li>관심사 : 웹 디자인, 여행</li>
        <li>이메일 : coding@example.com</li>
      </ul>
      <button class="btn">메일 보내기</button>
      <button class="btn btn-main">팔로우</button>
    </section>

    <section class="card notice">
      <h2>오늘의 한마디</h2>
      <p>천천히 가도 멈추지만 않으면 된다.</p>
    </section>
  </main>

</body>
</html>
