<!DOCTYPE html>
<!-- =========================================================
     3교시 빈칸 채우기 : 책 읽는 저녁 (독서 모임 안내)
     * 이 HTML 파일은 완성된 상태입니다. 수정하지 않습니다.
     * style.css의 빈칸(___)을 채웁니다.
     ========================================================= -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책 읽는 저녁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="header">
    <h1>책 읽는 저녁</h1>
    <p>매달 한 권, 함께 읽는 독서 모임</p>
  </header>

  <main>
    <section class="box">
      <h2 class="box-title">이번 달의 책</h2>
      <img class="cover" src="book.svg" alt="짙은 남색 표지의 책 그림">
      <p>『어린 왕자』를 함께 읽고 가장 기억에 남는 문장을 나눕니다.</p>
    </section>

    <section class="box">
      <h2 class="box-title">모임 안내</h2>
      <ul>
        <li>날짜 : 11월 28일 (토) 오후 7시</li>
        <li>장소 : 동네 작은 도서관 2층</li>
        <li>회비 : 5,000원 (음료 포함)</li>
      </ul>
      <p class="notice">책을 다 읽지 못해도 괜찮아요. 편하게 오세요!</p>
    </section>

    <section class="box">
      <h2 class="box-title">참여하기</h2>
      <button class="btn">참여 신청</button>
      <button class="btn btn-gray">문의하기</button>
    </section>
  </main>

  <footer id="footer">
    <p>&copy; 2026 책 읽는 저녁</p>
  </footer>

</body>
</html>
